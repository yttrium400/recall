[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recall-agent"
version = "0.1.0"
description = "A lightweight flight recorder for AI agent sessions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "anthropic>=0.25.0",
]

[project.scripts]
recall = "recall.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["recall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
